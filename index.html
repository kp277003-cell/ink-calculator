<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1B5E20">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Ink KI Calculator</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f0f4f0;color:#1a1a1a;font-size:16px}
  body{padding-bottom:env(safe-area-inset-bottom)}

  /* ── Top bar ── */
  .topbar{position:sticky;top:0;z-index:100;background:#1B5E20;padding:14px 16px 12px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 4px rgba(0,0,0,.2)}
  .topbar-title{font-size:18px;font-weight:600;color:#fff;display:flex;align-items:center;gap:8px}
  .topbar-title svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .topbar-btn{width:40px;height:40px;border-radius:50%;border:none;background:rgba(255,255,255,.15);cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff}
  .topbar-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .topbar-btn:active{background:rgba(255,255,255,.3)}

  /* ── Page ── */
  .page{padding:0 0 90px;min-height:calc(100vh - 56px)}

  /* ── Master card ── */
  .master-card{margin:14px 12px 0;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .mc-head{background:#E8F5E9;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;-webkit-user-select:none}
  .mc-head:active{background:#C8E6C9}
  .mc-head-left .ttl{font-size:14px;font-weight:600;color:#1B5E20;display:flex;align-items:center;gap:6px}
  .mc-head-left .ttl svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .mc-head-left .sub{font-size:12px;color:#388E3C;margin-top:2px}
  .mc-chev{width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:#1B5E20;transition:transform .25s;flex-shrink:0}
  .mc-chev svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .mc-chev.open{transform:rotate(180deg)}
  .mc-body{display:none}
  .mc-body.open{display:block}

  .mc-section{padding:14px 16px;border-bottom:.5px solid rgba(0,0,0,.06)}
  .mc-section:last-of-type{border-bottom:none}
  .mc-section+.mc-section{border-top:3px solid #1B5E20}
  .mc-sec-hd{font-size:11px;font-weight:700;color:#2E7D32;text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px;display:flex;align-items:center;gap:5px}
  .mc-sec-hd svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
  .mc-col-hd{display:flex;align-items:center;width:100%;padding:0 16px 6px;border-bottom:.5px solid rgba(0,0,0,.06);margin-bottom:0}
  .mc-row{display:flex;align-items:center;width:100%;margin-bottom:0;padding:10px 16px;border-bottom:1px solid rgba(0,0,0,.1)}
  .mc-row:last-of-type{border-bottom:none}
  .mc-row:last-of-type{margin-bottom:0}
  .mc-name{flex:1;font-size:13px;color:#1a1a1a;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mc-grade{font-size:11px;color:#bbb;width:36px;text-align:right;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pf{width:74px;font-size:14px;padding:7px 8px;border-radius:10px;border:1.5px solid #ddd;background:#fafafa;color:#1a1a1a;text-align:right;flex-shrink:0;-webkit-appearance:none;appearance:none}
  .pf:focus{outline:none;border-color:#1B5E20;background:#fff;box-shadow:0 0 0 3px rgba(27,94,32,.1)}
  .pf.ch{border-color:#F9A825;background:#FFFDE7;color:#E65100}
  .pu{font-size:12px;color:#bbb;flex-shrink:0;width:12px}
  .mc-tot{display:flex;justify-content:flex-end;align-items:center;gap:6px;padding-top:9px;margin-top:8px;border-top:.5px solid rgba(0,0,0,.08)}
  .mc-tot-lbl{font-size:12px;color:#999}
  .tok{font-size:13px;font-weight:600;color:#1B5E20}
  .tbad{font-size:13px;font-weight:600;color:#C62828}

  .mc-btns{display:flex;gap:10px;padding:14px 16px;background:#F9FBF9;border-top:.5px solid rgba(0,0,0,.06)}
  .btn-apply{flex:1;height:50px;border-radius:14px;border:none;background:#1B5E20;color:#fff;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px}
  .btn-apply svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
  .btn-apply:active{background:#145218;transform:scale(.98)}
  .btn-reset{height:50px;padding:0 18px;border-radius:14px;border:1.5px solid #ccc;background:#fff;color:#555;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:6px}
  .btn-reset svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .btn-reset:active{background:#f0f0f0;transform:scale(.98)}

  /* ── Sheet card ── */
  .sheet-card{margin:12px 12px 0;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .stabs{display:flex;overflow-x:auto;border-bottom:.5px solid rgba(0,0,0,.08);-webkit-overflow-scrolling:touch}
  .stabs::-webkit-scrollbar{display:none}
  .stab{flex-shrink:0;padding:14px 18px;font-size:13px;font-weight:600;border:none;background:transparent;cursor:pointer;color:#999;border-bottom:3px solid transparent;transition:color .15s,border-color .15s;white-space:nowrap}
  .stab.on{color:#1B5E20;border-bottom-color:#1B5E20}
  .stab:active{background:rgba(0,0,0,.04)}

  .sheet-body{padding:14px}

  .batch-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;background:#F1F8E9;border-radius:14px;padding:13px 15px}
  .batch-lbl{font-size:13px;color:#2E7D32;flex:1;display:flex;align-items:center;gap:6px;font-weight:600}
  .batch-lbl svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .batch-inp{width:88px;font-size:17px;font-weight:700;padding:8px 10px;border-radius:10px;border:1.5px solid #A5D6A7;background:#fff;color:#1B5E20;text-align:right;-webkit-appearance:none;appearance:none}
  .batch-inp:focus{outline:none;border-color:#1B5E20;box-shadow:0 0 0 3px rgba(27,94,32,.1)}
  .batch-unit{font-size:13px;color:#388E3C;font-weight:600;white-space:nowrap}

  /* ── KPI grid ── */
  .kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:12px}
  .kpi{background:#f8faf8;border-radius:12px;padding:13px}
  .kpi-lbl{font-size:11px;color:#888;margin-bottom:3px;display:flex;align-items:center;gap:4px;font-weight:500}
  .kpi-lbl svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .kpi-val{font-size:17px;font-weight:700;color:#1a1a1a;font-variant-numeric:tabular-nums}
  .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;display:inline-block}

  /* ── Composition bar ── */
  .cbar{height:10px;border-radius:5px;background:#E8F5E9;display:flex;overflow:hidden;margin-bottom:7px}
  .cseg{height:100%;transition:width .35s ease}
  .cleg{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .cli{font-size:11px;color:#555;display:flex;align-items:center;gap:3px;font-weight:500}

  /* ── Material table ── */
  .mat-list{border-radius:14px;overflow:hidden;border:.5px solid rgba(0,0,0,.08)}
  .mat-table{width:100%;border-collapse:collapse;table-layout:fixed}
  .th-mat{text-align:left;padding:9px 10px;font-size:11px;font-weight:700;color:#33691E;text-transform:uppercase;letter-spacing:.04em;background:#F1F8E9;width:25%}
  .th-grade{text-align:center;padding:9px 10px;font-size:11px;font-weight:700;color:#33691E;text-transform:uppercase;letter-spacing:.04em;background:#F1F8E9;width:25%}
  .th-pct{text-align:center;padding:9px 10px;font-size:11px;font-weight:700;color:#33691E;text-transform:uppercase;letter-spacing:.04em;background:#F1F8E9;width:25%}
  .th-kg{text-align:right;padding:9px 10px;font-size:11px;font-weight:700;color:#33691E;text-transform:uppercase;letter-spacing:.04em;background:#F1F8E9;width:25%}
  .td-mat{padding:11px 10px;font-size:13px;font-weight:600;color:#1a1a1a;border-top:1px solid rgba(0,0,0,.15);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:25%}
  .td-grade{padding:11px 10px;font-size:12px;color:#999;text-align:center;border-top:1px solid rgba(0,0,0,.15);width:25%}
  .td-pct{padding:11px 10px;font-size:12px;color:#555;text-align:center;border-top:1px solid rgba(0,0,0,.15);font-variant-numeric:tabular-nums;width:25%}
  .td-kg{padding:11px 10px;font-size:16px;font-weight:700;color:#1B5E20;text-align:right;border-top:1px solid rgba(0,0,0,.15);font-variant-numeric:tabular-nums;width:25%}
  tbody tr:active td{background:#f9fbe7}
  .tr-tot td{background:#F1F8E9;border-top:1.5px solid #1B5E20}
  .warn-bar{font-size:12px;color:#B71C1C;background:#FFEBEE;padding:10px 13px;display:flex;align-items:center;gap:6px;font-weight:500}
  .warn-bar svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;flex-shrink:0}

  .mc-head-static{background:#E8F5E9;padding:14px 16px;border-bottom:.5px solid rgba(0,0,0,.06)}
  .mc-head-static .ttl{font-size:14px;font-weight:600;color:#1B5E20;display:flex;align-items:center;gap:6px}
  .mc-head-static .ttl svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .mc-head-static .sub{font-size:12px;color:#388E3C;margin-top:2px}
  /* ── Bottom nav ── */
  .bottomnav{position:fixed;bottom:0;left:0;right:0;width:100%;background:#fff;border-top:.5px solid rgba(0,0,0,.1);z-index:100;padding:6px 0 max(10px,env(safe-area-inset-bottom));display:grid !important;grid-template-columns:1fr 1fr 1fr 1fr;box-sizing:border-box}
  .bni{border:none;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 0;width:100%}
  .bni-dot{width:22px;height:4px;border-radius:2px;background:transparent;transition:background .15s;margin-bottom:1px}
  .bni.on .bni-dot{background:#1B5E20}
  .bni svg{width:22px;height:22px;fill:none;stroke:#aaa;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:stroke .15s}
  .bni.on svg{stroke:#1B5E20}
  .bni-lbl{font-size:10px;color:#aaa;transition:color .15s;font-weight:500;white-space:nowrap}
  .bni.on .bni-lbl{color:#1B5E20}
  .bni:active{opacity:.7}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-title">
    <svg viewBox="0 0 24 24"><path d="M12 2C12 2 5 10 5 15a7 7 0 0014 0C19 10 12 2 12 2z"/></svg>
    Ink KI Calculator
  </div>
  <button class="topbar-btn" onclick="resetAll()" aria-label="Reset all">
    <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 109-9H3m0 0l4-4m-4 4l4 4"/></svg>
  </button>
</div>

<!-- Home page -->
<div class="page" id="pgHome">
  <div class="sheet-card">
    <div class="stabs" id="stabs">
      <button class="stab on" data-k="vinyl">Vinyl med.</button>
      <button class="stab" data-k="eva">EVA med.</button>
      <button class="stab" data-k="white">White ink</button>
      <button class="stab" data-k="cmy">CMY ink</button>
      <button class="stab" data-k="middem">Middem ink</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<!-- Settings page -->
<div class="page" id="pgSettings" style="display:none">

  <!-- PET INK master -->
  <div class="master-card" style="margin-bottom:12px">
    <div class="mc-head" onclick="toggleSection('petMaster','petChev')">
      <div class="mc-head-left">
        <div class="ttl">
          <svg viewBox="0 0 24 24"><path d="M12 2C12 2 5 10 5 15a7 7 0 0014 0C19 10 12 2 12 2z"/></svg>
          PET INK master
        </div>
        <div class="sub">Edit % for all PET sheets</div>
      </div>
      <div class="mc-chev" id="petChev">
        <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
      </div>
    </div>
    <div class="mc-body" id="petMaster">
      <div id="mcSections"></div>
    </div>
  </div>

  <!-- POLY INK master -->
  <div class="master-card" style="margin-top:12px">
    <div class="mc-head" onclick="toggleSection('polyMaster','polyChev')">
      <div class="mc-head-left">
        <div class="ttl">
          <svg viewBox="0 0 24 24"><path d="M9 3v11a3 3 0 006 0V3M6 3h12"/></svg>
          POLY INK master
        </div>
        <div class="sub">Edit % for all POLY sheets</div>
      </div>
      <div class="mc-chev" id="polyChev">
        <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
      </div>
    </div>
    <div class="mc-body" id="polyMaster">
      <div id="polyMcSections"></div>
    </div>
  </div>


</div>

<!-- POLY INK page -->
<div class="page" id="pgPoly" style="display:none">
  <div class="sheet-card">
    <div class="stabs" id="polytabs">
      <button class="stab on" data-k="ketonic">Ketonic resin</button>
      <button class="stab" data-k="white_poly">White poly ink</button>
      <button class="stab" data-k="cmy_poly">C,M,Y poly ink</button>
    </div>
    <div class="sheet-body" id="polySheetBody"></div>
  </div>
</div>
<!-- Material List page -->
<div class="page" id="pgMaterials" style="display:none">
  <div class="master-card">
    <div style="padding:16px;display:flex;align-items:center;justify-content:space-between;border-bottom:.5px solid rgba(0,0,0,.1)">
      <span style="font-size:18px;font-weight:500;color:#1a1a1a">Material master</span>
      <button onclick="addMaterial()" style="width:44px;height:44px;border-radius:6px;border:2px solid #1a1a1a;background:#fff;color:#1a1a1a;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:400;line-height:1">+</button>
    </div>
    <div id="matMasterBody" style="overflow-x:auto"></div>
  </div>
</div>
<div class="bottomnav" style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;width:100%;position:fixed;bottom:0;left:0;right:0">
  <button class="bni on" aria-label="PET INK">
    <div class="bni-dot"></div>
    <svg viewBox="0 0 24 24"><path d="M9 3h6m-6 0v6l-4 9a1 1 0 00.9 1.5h12.2A1 1 0 0019 18l-4-9V3M9 3h6"/></svg>
    <span class="bni-lbl">PET INK</span>
  </button>
  <button class="bni" aria-label="POLY INK">
    <div class="bni-dot"></div>
    <svg viewBox="0 0 24 24"><path d="M6 2h12v6l2 4v8a2 2 0 01-2 2H6a2 2 0 01-2-2v-8l2-4V2z"/><path d="M6 8h12"/></svg>
    <span class="bni-lbl">POLY INK</span>
  </button>
  <button class="bni" aria-label="Material List">
    <div class="bni-dot"></div>
    <svg viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/><path d="M9 12h6M9 16h4"/></svg>
    <span class="bni-lbl">Materials</span>
  </button>
  <button class="bni" aria-label="Settings">
    <div class="bni-dot"></div>
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
    <span class="bni-lbl">Settings</span>
  </button>
</div>

<script>
const ORIG={
  vinyl:{label:'Vinyl medium',step:'Step 1',base:150,rows:[
    {m:'VINYL',g:'TEGS',t:'resin',p:0.25},
    {m:'ETHYLE ACETATE',g:'SOLVNET',t:'solvent',p:0.335},
    {m:'TOLUENE',g:'SOLVNET',t:'solvent',p:0.215},
    {m:'MIBK',g:'SOLVNET',t:'solvent',p:0.12},
    {m:'MEK',g:'SOLVENT',t:'solvent',p:0.08},
  ]},
  eva:{label:'EVA medium',step:'Step 2',base:160,rows:[
    {m:'EVA',g:'4260',t:'resin',p:0.2},
    {m:'ETHYLE ACETATE',g:'SOLVNET',t:'solvent',p:0.2},
    {m:'TOLUENE',g:'SOLVNET',t:'solvent',p:0.6},
  ]},
  white:{label:'White ink',step:'',base:200,rows:[
    {m:'VINYL MED.',g:'6.00%',t:'resin',p:0.25},
    {m:'PIGMENT TIO2',g:'TR36',t:'pigment',p:0.25},
    {m:'FILLER',g:'POLYGLOSS',t:'pigment',p:0.03},
    {m:'---',g:'',t:'sep',p:0},
    {m:'ADDITIVE',g:'ANTISTATIC',t:'additive',p:0.003},
    {m:'ADDITIVE',g:'ARSR200D',t:'additive',p:0.005},
    {m:'ADDITIVE',g:'ED 30',t:'additive',p:0.003},
    {m:'ADDITIVE',g:'WND',t:'additive',p:0.0025},
    {m:'PU MED.7679',g:'75.00%',t:'resin',p:0},
    {m:'---',g:'',t:'sep',p:0},
    {m:'MEK OF BATCH',g:'3.50%',t:'solvent',p:0.015},
    {m:'MIBK OF BATCH',g:'5.50%',t:'solvent',p:0.025},
    {m:'TOL OF BATCH',g:'50.00%',t:'solvent',p:0.0865},
    {m:'EA OF BATCH',g:'50.00%',t:'solvent',p:0.13},
    {m:'---',g:'',t:'sep',p:0},
    {m:'EVA MED.',g:'4.00%',t:'resin',p:0.2},
  ]},
  cmy:{label:'CMY ink',step:'',base:200,rows:[
    {m:'VINYL MED.',g:'6.00%',t:'resin',p:0.25},
    {m:'PIGMENT TIO2',g:'TR36',t:'pigment',p:0.08},
    {m:'FILLER',g:'POLYGLOSS',t:'pigment',p:0},
    {m:'---',g:'',t:'sep',p:0},
    {m:'ADDITIVE',g:'ANTISTATIC',t:'additive',p:0.003},
    {m:'ADDITIVE',g:'ARSR200D',t:'additive',p:0.007},
    {m:'ADDITIVE',g:'ED 30',t:'additive',p:0.003},
    {m:'ADDITIVE',g:'WND',t:'additive',p:0.0025},
    {m:'PU MED.7679',g:'75.00%',t:'resin',p:0},
    {m:'---',g:'',t:'sep',p:0},
    {m:'MEK OF BATCH',g:'4.00%',t:'solvent',p:0.025},
    {m:'MIBK OF BATCH',g:'6.00%',t:'solvent',p:0.04},
    {m:'TOL OF BATCH',g:'45.00%',t:'solvent',p:0.15},
    {m:'EA OF BATCH',g:'55.00%',t:'solvent',p:0.24},
    {m:'---',g:'',t:'sep',p:0},
    {m:'EVA MED.',g:'4.00%',t:'resin',p:0.2},
  ]},
  middem:{label:'Middem ink',step:'',base:200,rows:[
    {m:'VINYL MED.',g:'10%',t:'resin',p:0.40},
    {m:'PU MED.7679',g:'55%',t:'resin',p:0.02},
    {m:'MEK OF BATCH',g:'4.80%',t:'solvent',p:0.03},
    {m:'MIBK OF BATCH',g:'3.20%',t:'solvent',p:0.05},

function saveSheet(k){
  state[k].rows.forEach((_,i)=>{
    const el=document.getElementById('mp-'+k+'-'+i);
    if(el) state[k].rows[i].p=fp(el.value)/100;
  });
  try{
    const saved=JSON.parse(localStorage.getItem('inkki_saved')||'{}');
    saved[k]=state[k].rows.map(r=>r.p);
    localStorage.setItem('inkki_saved',JSON.stringify(saved));
  }catch(e){}
  buildMaster();
  if(k===activeSheet) renderSheet(k);
  showToast('Saved: '+state[k].label);
}

function showToast(msg){
  let t=document.getElementById('toast');
  if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#1B5E20;color:#fff;padding:10px 20px;border-radius:24px;font-size:13px;font-weight:600;z-index:999;transition:opacity .3s';document.body.appendChild(t);}
  t.textContent=msg;t.style.opacity='1';
  clearTimeout(t._t);t._t=setTimeout(()=>{t.style.opacity='0'},2000);
}

function loadSaved(){
  try{
    const saved=JSON.parse(localStorage.getItem('inkki_saved')||'{}');
    KEYS.forEach(k=>{
      if(saved[k]) saved[k].forEach((p,i)=>{if(state[k].rows[i]) state[k].rows[i].p=p;});
    });
  }catch(e){}
}

function resetSheet(k){
  ORIG[k].rows.forEach((r,i)=>{state[k].rows[i].p=r.p});
  buildMaster();
  if(k===activeSheet) renderSheet(k);
}

function applyAll(){
  KEYS.forEach(k=>{
    state[k].rows.forEach((_,i)=>{
      const el=document.getElementById('mp-'+k+'-'+i);
      if(el) state[k].rows[i].p=fp(el.value)/100;
    });
  });
  updateTotals();
  renderSheet(activeSheet);
}

function updateTotals(){
  KEYS.forEach(k=>{
    const sum=state[k].rows.reduce((a,r)=>a+r.p,0);
    const ok=Math.abs(sum-1)<=0.005;
    const el=document.getElementById('mptot-'+k);
    if(el){el.textContent=(sum*100).toFixed(2)+'%';el.className=ok?'tok':'tbad';}
    state[k].rows.forEach((_,i)=>{
      const inp=document.getElementById('mp-'+k+'-'+i);
      if(inp) inp.classList.toggle('ch',Math.abs(state[k].rows[i].p-ORIG[k].rows[i].p)>0.00001);
    });
  });
}

function resetAll(){
  KEYS.forEach(k=>{
    ORIG[k].rows.forEach((r,i)=>{state[k].rows[i].p=r.p});
    batches[k]=ORIG[k].base;
  });
  if(document.getElementById('pgSettings').style.display!=='none') buildMaster();
  renderSheet(activeSheet);
}

document.addEventListener('input',e=>{
  if(!e.target.classList.contains('pf'))return;
  const[,k,i]=e.target.id.split('-');
  const v=fp(e.target.value)/100;
  state[k].rows[parseInt(i)].p=v;
  e.target.classList.toggle('ch',Math.abs(v-ORIG[k].rows[parseInt(i)].p)>0.00001);
  const sum=state[k].rows.reduce((a,r)=>a+r.p,0);
  const ok=Math.abs(sum-1)<=0.005;
  const tot=document.getElementById('mptot-'+k);
  if(tot){tot.textContent=(sum*100).toFixed(2)+'%';tot.className=ok?'tok':'tbad';}
  if(k===activeSheet) renderSheet(k);
});

function buildMaterialList(){
  // Collect unique materials from all sheets
  const allMats={};
  const allSheets=[
    ...KEYS.map(k=>({src:'PET INK',sheet:ORIG[k].label,...ORIG[k]})),
    ...POLY_KEYS.map(k=>({src:'POLY INK',sheet:POLY_ORIG[k].label,...POLY_ORIG[k]}))
  ];
  allSheets.forEach(s=>{
    s.rows.forEach(r=>{
      if(r.t==='sep') return;
      const key=r.m.trim().toUpperCase();
      if(!allMats[key]) allMats[key]={m:r.m,g:r.g,sheets:[]};
      if(!allMats[key].sheets.includes(s.sheet)) allMats[key].sheets.push(s.sheet);
    });
  });
  const sorted=Object.values(allMats).sort((a,b)=>a.m.localeCompare(b.m));
  document.getElementById('matListBody').innerHTML=`
    <table class="mat-table" style="width:100%">
      <thead><tr>
        <th class="th-mat">Material</th>
        <th class="th-grade">Grade</th>
        <th style="text-align:left;padding:9px 10px;font-size:11px;font-weight:700;color:#33691E;text-transform:uppercase;letter-spacing:.04em;background:#F1F8E9">Used in</th>
      </tr></thead>
      <tbody>${sorted.map(m=>`<tr>
        <td class="td-mat">${m.m}</td>
        <td class="td-grade">${m.g}</td>
        <td style="padding:11px 10px;font-size:11px;color:#555;border-top:1px solid rgba(0,0,0,.15)">${m.sheets.join(', ')}</td>
      </tr>`).join('')}
      </tbody>
    </table>`;
}

        <svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:none;stroke:#1B5E20;stroke-width:2.5;stroke-linecap:round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        <span style="font-size:15px;font-weight:700;color:#1B5E20">Edit material</span>
      </div>
      <div style="padding:16px;display:flex;flex-direction:column;gap:13px">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          <div>${lbl('Type')}
            <div style="display:flex;gap:6px;align-items:center">
              <select id="matType" style="flex:1;padding:11px 10px;border-radius:10px;border:1.5px solid #ddd;font-size:13px;background:#fafafa;-webkit-appearance:none;appearance:none">
                ${typeOpts().map(t=>`<option value="${t}" ${m.type===t?'selected':''}>${t.charAt(0).toUpperCase()+t.slice(1)}</option>`).join('')}
              </select>
              <button onclick="addCustomType()" style="width:36px;height:40px;border-radius:10px;border:1.5px solid #A5D6A7;background:#E8F5E9;color:#1B5E20;font-size:20px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700">+</button>
            </div>
          </div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          <div>${lbl('Company name')}${inp('matCompany','e.g. BASF',m.company||'')}</div>
          <div>${lbl('Company code')}${inp('matCompCode','e.g. B-101',m.compCode||'')}</div>
        </div>
        <div>${lbl('Used in')}
          <div style="display:flex;gap:12px;padding:10px 12px;border-radius:10px;border:1.5px solid #ddd;background:#fafafa">
            <label style="display:flex;align-items:center;gap:7px;font-size:14px;cursor:pointer">
              <input type="checkbox" id="usedPet" ${(m.used||'').includes('PET INK')?'checked':''} style="width:18px;height:18px;accent-color:#1B5E20;cursor:pointer"> PET INK
            </label>
            <label style="display:flex;align-items:center;gap:7px;font-size:14px;cursor:pointer">
              <input type="checkbox" id="usedPoly" ${(m.used||'').includes('POLY INK')?'checked':''} style="width:18px;height:18px;accent-color:#1B5E20;cursor:pointer"> POLY INK
            </label>
          </div>
        </div>
        <div>${lbl('Note')}
          <textarea id="matNote" rows="2" autocomplete="off" style="width:100%;padding:11px 12px;border-radius:10px;border:1.5px solid #ddd;font-size:14px;background:#fafafa;resize:none;font-family:inherit">${m.note||''}</textarea>
        </div>
      </div>
      <div style="display:flex;gap:10px;padding:4px 16px 16px">
        <button onclick="document.getElementById('matAddOverlay').remove()" style="flex:1;height:48px;border-radius:12px;border:1.5px solid #ccc;background:#fff;color:#555;font-size:14px;font-weight:600;cursor:pointer">Cancel</button>
        <button onclick="updateMaterial(${i})" style="flex:1;height:48px;border-radius:12px;border:none;background:#1B5E20;color:#fff;font-size:15px;font-weight:700;cursor:pointer">Update</button>
      </div>
    </div>`;
  document.body.appendChild(ov);
}

function updateMaterial(i){
  const type=document.getElementById('matType').value;
  const company=document.getElementById('matCompany').value.trim();
  const compCode=document.getElementById('matCompCode').value.trim().toUpperCase();
  const usedArr=[];
  if(document.getElementById('usedPet').checked) usedArr.push('PET INK');
  if(document.getElementById('usedPoly').checked) usedArr.push('POLY INK');
  const used=usedArr.join(', ');
  const note=document.getElementById('matNote').value.trim();
  matMasterList[i]={type,company,compCode,used,note};
  try{localStorage.setItem('inkki_matmaster',JSON.stringify(matMasterList));}catch(e){}
  document.getElementById('matAddOverlay').remove();
  buildMatMaster();
  showToast('Material updated');
}

function addMaterial(){
  const typeOpts=()=>{
    const customs=JSON.parse(localStorage.getItem('inkki_custom_types')||'[]');
    const base=['solvent','resin','pigment','additive'];
    return [...base,...customs.filter(c=>!base.includes(c))];
  };
  const ov=document.createElement('div');
  ov.id='matAddOverlay';
  ov.style.cssText='position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);z-index:9999;overflow-y:auto;display:flex;align-items:flex-start;justify-content:center;padding:20px';
  const lbl=(text)=>`<div style="font-size:11px;font-weight:700;color:#555;margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em">${text}</div>`;
  const inp=(id,ph)=>`<input id="${id}" type="text" placeholder="${ph}" autocomplete="off" style="width:100%;padding:11px 12px;border-radius:10px;border:1.5px solid #ddd;font-size:14px;background:#fafafa;-webkit-appearance:none">`;
  ov.innerHTML=`
    <div style="background:#fff;border-radius:20px;width:100%;max-width:400px;overflow:hidden;margin-top:10px">
      <div style="background:#E8F5E9;padding:14px 16px;display:flex;align-items:center;gap:8px;border-bottom:.5px solid rgba(0,0,0,.08)">
        <svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:none;stroke:#1B5E20;stroke-width:2.5;stroke-linecap:round"><path d="M12 5v14M5 12h14"/></svg>
        <span style="font-size:15px;font-weight:700;color:#1B5E20">Add material</span>
      </div>
      <div style="padding:16px;display:flex;flex-direction:column;gap:13px">

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          <div>${lbl('Type')}
            <div style="display:flex;gap:6px;align-items:center">
              <select id="matType" style="flex:1;padding:11px 10px;border-radius:10px;border:1.5px solid #ddd;font-size:13px;background:#fafafa;-webkit-appearance:none;appearance:none">
                ${typeOpts().map(t=>`<option value="${t}">${t.charAt(0).toUpperCase()+t.slice(1)}</option>`).join('')}
              </select>
              <button onclick="addCustomType()" style="width:36px;height:40px;border-radius:10px;border:1.5px solid #A5D6A7;background:#E8F5E9;color:#1B5E20;font-size:20px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700">+</button>
            </div>
          </div>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          <div>${lbl('Company name')}${inp('matCompany','e.g. BASF')}</div>
          <div>${lbl('Company code')}${inp('matCompCode','e.g. B-101')}</div>
        </div>

        <div>${lbl('Used in')}
          <div style="display:flex;gap:12px;padding:10px 12px;border-radius:10px;border:1.5px solid #ddd;background:#fafafa">
            <label style="display:flex;align-items:center;gap:7px;font-size:14px;color:#1a1a1a;cursor:pointer">
              <input type="checkbox" id="usedPet" style="width:18px;height:18px;accent-color:#1B5E20;cursor:pointer"> PET INK
            </label>
            <label style="display:flex;align-items:center;gap:7px;font-size:14px;color:#1a1a1a;cursor:pointer">
              <input type="checkbox" id="usedPoly" style="width:18px;height:18px;accent-color:#1B5E20;cursor:pointer"> POLY INK
            </label>
          </div>
        </div>

        <div>${lbl('Note')}
          <textarea id="matNote" placeholder="Any additional notes..." rows="2" autocomplete="off" style="width:100%;padding:11px 12px;border-radius:10px;border:1.5px solid #ddd;font-size:14px;background:#fafafa;resize:none;font-family:inherit"></textarea>
        </div>

      </div>
      <div style="display:flex;gap:10px;padding:4px 16px 16px">
        <button onclick="document.getElementById('matAddOverlay').remove()" style="flex:1;height:48px;border-radius:12px;border:1.5px solid #ccc;background:#fff;color:#555;font-size:14px;font-weight:600;cursor:pointer">Cancel</button>
        <button onclick="saveMaterial()" style="flex:1;height:48px;border-radius:12px;border:none;background:#1B5E20;color:#fff;font-size:15px;font-weight:700;cursor:pointer">Save</button>
      </div>
    </div>`;
  document.body.appendChild(ov);
  setTimeout(()=>document.getElementById('matName').focus(),100);
}

function addCustomType(){
  const t=prompt('Enter new type name:');
  if(!t||!t.trim()) return;
  const name=t.trim().toLowerCase();
  const customs=JSON.parse(localStorage.getItem('inkki_custom_types')||'[]');
  if(!customs.includes(name)){customs.push(name);localStorage.setItem('inkki_custom_types',JSON.stringify(customs));}
  const sel=document.getElementById('matType');
  if(sel){const opt=document.createElement('option');opt.value=name;opt.textContent=name.charAt(0).toUpperCase()+name.slice(1);sel.appendChild(opt);sel.value=name;}
}

function saveMaterial(){
  const type=document.getElementById('matType').value;
  const company=document.getElementById('matCompany').value.trim();
  const compCode=document.getElementById('matCompCode').value.trim().toUpperCase();
  const usedArr=[];
  if(document.getElementById('usedPet').checked) usedArr.push('PET INK');
  if(document.getElementById('usedPoly').checked) usedArr.push('POLY INK');
  const used=usedArr.join(', ');
  const note=document.getElementById('matNote').value.trim();
  matMasterList.push({type,company,compCode,used,note});
  try{localStorage.setItem('inkki_matmaster',JSON.stringify(matMasterList));}catch(e){}
  document.getElementById('matAddOverlay').remove();
  buildMatMaster();
  showToast('Material saved');
}

function deleteMaterial(i){
  matMasterList.splice(i,1);
  try{localStorage.setItem('inkki_matmaster',JSON.stringify(matMasterList));}catch(e){}
  buildMatMaster();
}

loadSaved();
renderSheet('vinyl');
renderPolySheet('ketonic');
</script>
